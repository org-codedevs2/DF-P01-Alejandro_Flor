name: Update project status

on:
  issues:
    types: [assigned]

permissions:
  contents: read

jobs:
  set-in-progress:
    runs-on: ubuntu-latest
    steps:
      - name: Set issue status
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          PROJECT_ORG: org-codedevs2
          PROJECT_NUMBER: 10
          ISSUE_NODE_ID: ${{ github.event.issue.node_id }}
        shell: bash
        run: |
          set -euo pipefail

          project_data="$(gh api graphql -f query='
            query($org: String!, $number: Int!) {
              organization(login: $org) {
                projectV2(number: $number) {
                  id
                  fields(first: 100) {
                    nodes {
                      ... on ProjectV2SingleSelectField {
                        id
                        name
                        options { id name }
                      }
                    }
                  }
                }
              }
            }' -f org="$PROJECT_ORG" -F number="$PROJECT_NUMBER")"

          project_id="$(jq -r '.data.organization.projectV2.id // empty' <<< "$project_data")"
          status_field_id="$(jq -r '.data.organization.projectV2.fields.nodes[] | select(.name == "Status") | .id' <<< "$project_data")"
          in_progress_id="$(jq -r '.data.organization.projectV2.fields.nodes[] | select(.name == "Status") | .options[] | select(.name == "In progress") | .id' <<< "$project_data")"

          if [[ -z "$project_id" || -z "$status_field_id" || -z "$in_progress_id" ]]; then
            echo "No encontré el Project, el campo Status o la opción In progress."
            exit 1
          fi

          item_id="$(gh api graphql -f query='
            mutation($project: ID!, $issue: ID!) {
              addProjectV2ItemById(input: {projectId: $project, contentId: $issue}) {
                item { id }
              }
            }' -f project="$project_id" -f issue="$ISSUE_NODE_ID" \
            --jq '.data.addProjectV2ItemById.item.id')"

          gh api graphql -f query='
            mutation($project: ID!, $item: ID!, $field: ID!, $option: String!) {
              updateProjectV2ItemFieldValue(input: {
                projectId: $project
                itemId: $item
                fieldId: $field
                value: {singleSelectOptionId: $option}
              }) {
                projectV2Item { id }
              }
            }' \
            -f project="$project_id" \
            -f item="$item_id" \
            -f field="$status_field_id" \
            -f option="$in_progress_id"