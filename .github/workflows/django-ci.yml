name: ARKA Django CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  django-check:
    name: Django en ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Comprobar proyecto Django
        working-directory: src
        run: python manage.py check

      - name: Ejecutar pruebas
        working-directory: src
        run: python manage.py test

  deploy:
    name: Desplegar en Render
    runs-on: ubuntu-latest
    needs: django-check
    # Solo despliega cuando se hace push a main (no en PRs ni en develop)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Disparar deploy en Render
        run: |
          curl --fail-with-body -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
          echo "✅ Deploy disparado exitosamente en Render"